version: 2

sources:
  - name: raw
    schema: main
    tables:
      - name: advertisers
        meta:
          external_location: "data/raw/advertisers.parquet"
      - name: campaigns
        meta:
          external_location: "data/raw/campaigns.parquet"
      - name: ad_events
        meta:
          external_location: "read_parquet('data/raw/ad_events/*/part.parquet', hive_partitioning=true)"
